---
# This playbook automates the process of creating symbolic links (symlinks) in the user's home directory 
# that point to corresponding folders in the user's Dropbox directory. It ensures that any existing folders 
# in the home directory are backed up to a designated backup directory before being replaced by symlinks. 
# The playbook performs the following steps:
# 
# 1. **Variable Initialization**: Dynamically resolves paths for the Dropbox directory, the user's home 
#    directory, and the backup directory. It also defines a list of folders to be symlinked.
# 
# 2. **Debugging and Review**: Prints the resolved paths and displays the planned symlink operations for 
#    user review. Prompts the user for confirmation before proceeding.
# 
# 3. **Backup Existing Folders**: Creates a backup directory if it doesn't already exist and backs up any 
#    existing folders in the home directory that match the specified folder list. Large `.photoslibrary` 
#    files are excluded from the backup to save space.
# 
# 4. **Remove Existing Folders**: Deletes the original folders in the home directory to make way for the 
#    symlinks.
# 
# 5. **Create Symlinks**: Creates symbolic links in the home directory that point to the corresponding 
#    folders in the Dropbox directory. Additionally, it creates a special symlink for "Movies" that points 
#    to the "Videos" folder in Dropbox.
# 
# 6. **Post-Execution Messages**: Provides a summary of the operation and reminds the user to check the 
#    backup directory for any files that may need attention.
# 
# This playbook is idempotent, meaning it can be safely re-run without causing unintended changes. It also 
# includes error handling to ensure that tasks fail gracefully if prerequisites are not met or if no files 
# exist to back up.

- name: Set up Dropbox symlinks
  hosts: all
  gather_facts: true  # Ensures facts are gathered for use in tasks
  become: true  # Elevates privileges for tasks requiring root access

  vars:
    dropbox_path: "{{ lookup('pipe', 'realpath ~/Library/CloudStorage/Dropbox') }}"  # Resolves the absolute path to Dropbox
    symlink_entrance: "{{ lookup('pipe', 'realpath ~') }}"  # Resolves the absolute path to the user's home directory
    backup_dir: "{{ lookup('pipe', 'realpath .') }}/.backup"  # Resolves the absolute path to the current directory and appends `.backup`
    folders: ['Downloads', 'Documents', 'Pictures', 'Videos']  # List of folders to symlink

  tasks:
    - name: Print variables for debugging
      ansible.builtin.debug:
        msg:
          - "BACKUP_DIR = {{ backup_dir }}"
          - "USER = {{ ansible_user }}"
          - "DROPBOX_PATH = {{ dropbox_path }}"
          - "SYMLINK_ENTRANCE = {{ symlink_entrance }}"

    - name: Display folder symlinks for review
      ansible.builtin.debug:
        msg: "{{ symlink_entrance }}/{{ item }} ---> {{ dropbox_path }}/{{ item }}"
      loop: "{{ folders }}"

    - name: Check existing folders in home directory
      ansible.builtin.command:
        cmd: ls -la ~  # Lists all files and directories in the home directory
      register: home_listing

    - name: Print Dropbox folders in home directory
      ansible.builtin.debug:
        msg: "{{ home_listing.stdout_lines | select('search', 'Dropbox') | list }}"  # Filters and displays Dropbox-related entries

    - name: Prompt for confirmation before proceeding
      ansible.builtin.pause:
        prompt: "Are you positive you want to perform the symlink operation described above?"

    - name: Create backup directory if it doesn't exist
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0755'  # Ensures the directory has appropriate permissions

    - name: Backup existing directories to backup location
      ansible.builtin.synchronize:
        src: "{{ symlink_entrance }}/{{ item }}/"
        dest: "{{ backup_dir }}/{{ item }}"
        rsync_opts:
          - "--exclude=*.photoslibrary"  # Excludes large `.photoslibrary` files
        mode: pull  # Ensures data is pulled from the source
      loop: "{{ folders }}"
      ignore_errors: false  # Avoids ignoring errors; ensures proper error handling
      failed_when: false  # Prevents task failure if no files exist to back up

    - name: Remove existing directories in the home directory
      ansible.builtin.file:
        path: "{{ symlink_entrance }}/{{ item }}"
        state: absent  # Deletes the directory if it exists
      loop: "{{ folders }}"

    - name: Create symlinks to Dropbox folders
      ansible.builtin.file:
        src: "{{ dropbox_path }}/{{ item }}"
        dest: "{{ symlink_entrance }}/{{ item }}"
        state: link  # Creates a symbolic link
      loop: "{{ folders }}"

    - name: Post-execution messages
      ansible.builtin.debug:
        msg:
          - "All done!"
          - "Check the backup directory for any old files that need to be dealt with."
          - "Backup directory: {{ backup_dir }}"

    - name: Create symlink for Movies to Videos
      ansible.builtin.file:
        src: "{{ dropbox_path }}/Videos"
        dest: "{{ symlink_entrance }}/Movies"
        state: link  # Creates a symbolic link for Movies to Videos
