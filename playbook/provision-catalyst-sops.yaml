---
- name: Provision and configure hosts
  hosts: localhost
  become: yes
  vars:
    playbook_repo_url: "https://github.com/yourusername/machines-repo"
    playbook_repo_dest: "/tmp/machines-repo"

  tasks:
    - name: Ensure dependencies are installed
      package:
        name: "{{ item }}"
        state: present
      loop:
        - git
        - ansible

    - name: Clone the machines repository
      git:
        repo: "{{ playbook_repo_url }}"
        dest: "{{ playbook_repo_dest }}"
        update: yes

    - name: Install roles and collections from requirements.yml
      command: ansible-galaxy install -r requirements.yml
      args:
        chdir: "{{ playbook_repo_dest }}"

    - name: Run install_sops playbook
      command: ansible-playbook -i inventory/development playbooks/install_sops.yaml
      args:
        chdir: "{{ playbook_repo_dest }}"

    - name: Run provision_sops_keys playbook
      command: ansible-playbook -i inventory/development playbooks/provision_sops_keys.yaml
      args:
        chdir: "{{ playbook_repo_dest }}"

    # - name: Run site playbook
    #   command: ansible-playbook -i inventory/development playbooks/site.yml
    #   args:
    #     chdir: "{{ playbook_repo_dest }}"
