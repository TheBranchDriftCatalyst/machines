---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml

driver:
  name: docker

platforms:
  # Linux testing platforms (Docker)
  - name: ubuntu-20.04
    image: geerlingguy/docker-ubuntu2004-ansible:latest
    pre_build_image: true
    command: ""
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: molecule

  - name: ubuntu-22.04
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    command: ""
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: molecule

provisioner:
  name: ansible
  inventory:
    host_vars:
      ubuntu-20.04:
        catalyst_test_mode: true
        ansible_python_interpreter: /usr/bin/python3
        homebrew_prefix: /usr/local
        ansible_facts:
          os_family: Debian
          architecture: x86_64
        simulate_macos: false
      ubuntu-22.04:
        catalyst_test_mode: true
        ansible_python_interpreter: /usr/bin/python3
        homebrew_prefix: /usr/local
        ansible_facts:
          os_family: Debian
          architecture: x86_64
        simulate_macos: false
  env:
    ANSIBLE_ROLES_PATH: "../../roles"
    ANSIBLE_COLLECTIONS_PATH: "~/.ansible/collections"

verifier:
  name: ansible

scenario:
  name: default
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy