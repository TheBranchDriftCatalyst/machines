---
- name: Mount NFS shares from TrueNAS hosts using autofs
  hosts: drogon
  gather_facts: true
  become: true
  become_method: ansible.builtin.sudo
  vars:
    autofs_base: "/nfs"

    nfs_exports:
      # viserion:
      
      # http://192.168.1.200:81/ui/sharing/nfs
      truenas00:
        - export: "/mnt/megapool/px200"
          map_name: "megapool_px200"
        - export: "/mnt/iocage/appdata"
          map_name: "iocage_appdata"
        - export: "/mnt/megapool/666"
          map_name: "megapool_666"
        - export: "/mnt/megapool/px200"
          map_name: "megapool_px200"
        - export: "/mnt/megapool/books"
          map_name: "megapool_books"
        - export: "/mnt/megapool/drogon-services"
          map_name: "megapool_drogon-services"
        - export: "/mnt/megapool/media"
          map_name: "megapool_media"
        - export: "/mnt/megapool/media/tv"
          map_name: "megapool_media_tv"
        - export: "/mnt/megapool/downloads"
          map_name: "megapool_downloads"
              # /mnt/megapool/px200
    # /mnt/megapool/px200/.stash_meta
    # /mnt/megapool/px200/poon
    # /mnt/megapool/px200/poonx
      # - export: "/mnt/megapool/backups"
      #   map_name: "megapool/backups"
      # truenas02:
      # - export: "/mnt/storage/media2"
      #   map_name: "media2"

  tasks:
    - name: Debug resolved IP addresses for NFS exports
      ansible.builtin.debug:
        msg: "Host {{ item.key }} resolved to {{ hostvars[item.key].ansible_host }}"
      loop: "{{ nfs_exports | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Resolve hostnames to IP addresses
      ansible.builtin.set_fact:
        resolved_nfs_exports: >-
          {{
            nfs_exports | dict2items | map(
              "combine", {"key": hostvars[item.key].ansible_host}
            ) | list | items2dict
          }}
      loop: "{{ nfs_exports | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Debug resolved NFS exports
      ansible.builtin.debug:
        var: resolved_nfs_exports

    - name: Install required packages for autofs and NFS
      ansible.builtin.apt:
        name:
          - autofs
          - nfs-common
        state: present
        update_cache: true

    - name: Enable and start the autofs service
      ansible.builtin.systemd:
        name: autofs
        enabled: true
        state: started

    - name: Ensure the base mount directory exists
      ansible.builtin.file:
        path: "{{ autofs_base }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configure auto.master to include auto.nfs
      ansible.builtin.blockinfile:
        path: "/etc/auto.master"
        block: |
          {{ autofs_base }} /etc/auto.nfs --ghost
        marker: "# {mark} ANSIBLE MANAGED AUTOFS"

    - name: Generate the /etc/auto.nfs map file
      ansible.builtin.copy:
        dest: "/etc/auto.nfs"
        mode: '0644'
        content: |
          {% for host, exports in resolved_nfs_exports.items() %}
          {% for share in exports %}
          {{ share.map_name }} -fstype=nfs,rw,nosuid,soft,intr {{ host }}:{{ share.export }}
          {% endfor %}
          {% endfor %}

    - name: Reload the autofs service to apply changes
      ansible.builtin.systemd:
        name: autofs
        state: reloaded
