---
# This file is used to set up the environment before the converge phase.
# It may include tasks to install dependencies or prepare the system for testing.

- name: Prepare environment for testing
  hosts: all
  tasks:
    - name: Install required packages for testing
      raw: |
        if command -v yum &>/dev/null; then
          yum install -y python3 python3-pip;
        elif command -v dnf &>/dev/null; then
          dnf install -y python3 python3-pip;
        elif command -v apt-get &>/dev/null; then
          apt-get update && apt-get install -y python3 python3-pip;
        fi

    - name: Ensure /tmp/.ansible/tmp exists
      ansible.builtin.file:
        path: /tmp/.ansible/tmp
        state: directory
        mode: '1777'
