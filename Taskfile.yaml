version: '3'

dotenv: [ '.env' ]

tasks:
  default:
    desc: Display available tasks
    cmds:
    - echo "Available tasks:"
    - echo "  - deps"
    - echo "  - deploy_ssh_key"
    - echo "  - pre-provision"
    - echo "  - play"

  play:
    desc: |
      Run an Ansible playbook for a specific role.
      Usage: task play -- <role_name>
      Example: task play -- hostname_localdomain
    silent: true
    cmds:
    - |
      if [ -z "{{.CLI_ARGS}}" ]; then
        echo "Error: You must specify a role name. Usage: task play -- <role_name>"
        exit 1
      fi
    - |
      if [ -z "$ANSIBLE_PASSWORD" ] || [ -z "$ANSIBLE_BECOME_PASSWORD" ]; then
        echo "Error: ANSIBLE_PASSWORD and ANSIBLE_BECOME_PASSWORD environment variables must be set."
        exit 1
      fi
    - |
      echo "Running Ansible playbook for role '{{.CLI_ARGS}}'..."
      ansible-playbook \
        -i ./inventory.yml \
        ./plays/{{.CLI_ARGS}}/playbook.yml \
        --extra-vars "ansible_password=$ANSIBLE_PASSWORD ansible_become_password=$ANSIBLE_BECOME_PASSWORD"

  deps:
    desc: Install project dependencies
    cmds:
    - echo "Installing Python dependencies with Poetry..."
    - poetry install
    - echo "Installing Ansible Galaxy roles..."
    - ansible-galaxy install -r requirements.yml
  # These are deprecated but kept for posterity
