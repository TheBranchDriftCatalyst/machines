  #   desc: Deploy local SSH public key to remote authorized_keys
  #   preconditions:
  #     - sh: '[ -f ~/.ssh/id_rsa.pub ]'
  #       msg: "Error: SSH public key (~/.ssh/id_rsa.pub) not found."
  #   cmds:
  #     - echo "Deploying SSH public key to remote hosts..."
  #     - ansible-playbook -i inventory.yml ./tasks/webservers/deploy_ssh_key.ansible.yml -l homelab -k

